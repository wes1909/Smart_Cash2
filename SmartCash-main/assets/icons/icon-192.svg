<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Fundo -->
  <rect width="192" height="192" rx="38" fill="#0f1117"/>
  <!-- Gradiente de fundo do card -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6ef7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Card central -->
  <rect x="24" y="24" width="144" height="144" rx="28" fill="url(#bg)"/>
  <!-- Cifrão / Símbolo -->
  <text x="96" y="118" font-family="system-ui, -apple-system, sans-serif"
        font-size="80" font-weight="900" fill="white"
        text-anchor="middle" dominant-baseline="middle">$</text>
  <!-- Brilho superior -->
  <ellipse cx="130" cy="46" rx="20" ry="12" fill="white" opacity="0.12"/>
</svg>
